<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PicMark — 圖片標記與標註工作台</title>
<style>
/* =========================================================
   PicMark — design tokens
   ========================================================= */
:root{
    --paper:#F4F5F7;
    --surface:#FFFFFF;
    --surface-2:#FAFBFC;
    --line:#E4E7EC;
    --line-strong:#D3D8E0;
    --ink:#15181D;
    --ink-2:#5B6472;
    --ink-3:#8A93A2;

    --stage:#24272E;
    --stage-2:#1B1E24;
    --stage-line:rgba(255,255,255,.10);
    --stage-ink:#D8DCE3;
    --stage-ink-2:#9AA2AF;
    --mark:rgba(255,255,255,.40);

    --accent:#1F6F5C;
    --accent-hover:#1A5F4F;
    --accent-soft:#E8F1EE;
    --accent-ring:rgba(31,111,92,.30);
    --danger:#B4302B;
    --danger-soft:#FBECEB;

    --r-sm:6px;
    --r:8px;
    --r-lg:12px;

    --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans TC","Noto Sans JP","Noto Sans KR","Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;

    --rail:60px;
    --panel:286px;
    --top:56px;
    --status:30px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
    margin:0;
    font-family:var(--ui);
    font-size:13px;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
}
button{font-family:inherit}

.eyebrow{
    font-size:10px;
    font-weight:700;
    letter-spacing:.10em;
    text-transform:uppercase;
    color:var(--ink-3);
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* =========================================================
   App shell
   ========================================================= */
.app{
    height:100vh;
    height:100dvh;
    display:grid;
    grid-template-rows:var(--top) 1fr var(--status);
}

/* ---------- Top bar ---------- */
.topbar{
    display:flex;
    align-items:center;
    gap:14px;
    padding:0 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    min-width:0;
}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.brand-mark{
    width:28px;height:28px;border-radius:7px;
    background:var(--accent);
    color:#fff;
    display:grid;place-items:center;
    flex:0 0 auto;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand-tagline{font-size:10.5px;color:var(--ink-3)}

.topbar-divider{width:1px;height:24px;background:var(--line);flex:0 0 auto}

.filechip{
    display:flex;align-items:center;gap:10px;
    min-width:0;flex:1 1 auto;
    padding:5px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--surface-2);
    color:var(--ink-2);
    max-width:420px;
}
.filechip .chip-dot{width:6px;height:6px;border-radius:50%;background:var(--line-strong);flex:0 0 auto}
.filechip.is-loaded .chip-dot{background:var(--accent)}
.chip-name{
    font-size:12px;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip-dim{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto}
.chip-index{
    font-family:var(--mono);font-size:10.5px;font-weight:700;flex:0 0 auto;
    padding:1px 6px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);
}
.chip-index:empty{display:none}

.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex:0 0 auto}

/* ---------- Buttons ---------- */
.btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    height:32px;padding:0 12px;
    border:1px solid var(--line-strong);
    border-radius:var(--r-sm);
    background:var(--surface);
    color:var(--ink);
    font-size:12.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s,border-color .15s,color .15s;
    white-space:nowrap;
    position:relative;
}
.btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:0 0 auto}

.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-hover);border-color:var(--accent-hover)}

.btn-icon{
    width:32px;height:32px;padding:0;
    border-color:transparent;background:transparent;color:var(--ink-2);
}
.btn-icon:hover:not(:disabled){background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.btn-icon.is-danger:hover:not(:disabled){background:var(--danger-soft);border-color:#F0D2D0;color:var(--danger)}

/* ---------- Language ---------- */
.lang{
    display:flex;align-items:center;gap:5px;
    height:32px;padding:0 6px 0 9px;
    border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);
    color:var(--ink-2);
}
.lang svg{width:15px;height:15px;flex:0 0 auto}
.lang select{
    border:none;background:transparent;
    font-family:inherit;font-size:12px;font-weight:600;color:var(--ink);
    padding:0 18px 0 0;
    appearance:none;-webkit-appearance:none;
    cursor:pointer;outline:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6472' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 0 center;background-size:13px;
}

/* =========================================================
   Workspace
   ========================================================= */
.workspace{
    display:grid;
    grid-template-columns:var(--rail) 1fr var(--panel);
    min-height:0;min-width:0;
}

/* ---------- Tool rail ---------- */
.rail{
    position:relative;
    background:var(--surface);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;
    gap:4px;
    padding:10px 0;
    overflow:auto;
}
.rail::after{
    content:"";
    position:absolute;top:10px;bottom:10px;right:0;width:5px;
    background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 9px);
    pointer-events:none;
}
.rail-label{margin:2px 0 6px}

.mode-btn{
    position:relative;
    width:40px;height:40px;
    display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;border-radius:var(--r);
    background:transparent;color:var(--ink-2);
    cursor:pointer;
    transition:background .15s,color .15s,border-color .15s;
    flex:0 0 auto;
}
.mode-btn svg{width:20px;height:20px}
.mode-btn:hover{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.mode-btn.active::before{
    content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
    width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--accent);
}
.tool-tip{display:none}

/* floating tooltip (never clipped by scroll containers) */
.float-tip{
    position:fixed;z-index:900;
    display:none;align-items:center;gap:7px;
    padding:5px 9px;border-radius:var(--r-sm);
    background:var(--ink);color:#fff;
    font-size:11.5px;font-weight:600;white-space:nowrap;
    pointer-events:none;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
}
.float-tip .tip-key{
    font-family:var(--mono);font-size:10.5px;font-weight:700;
    padding:1px 5px;border-radius:4px;
    background:rgba(255,255,255,.16);color:#fff;
}

/* ---------- Stage column ---------- */
.center{display:flex;flex-direction:column;min-width:0;min-height:0}

.stage{
    flex:1 1 auto;
    position:relative;
    background:radial-gradient(120% 100% at 50% 0%,var(--stage) 0%,var(--stage-2) 100%);
    min-width:0;min-height:0;
    overflow:hidden;
    touch-action:none;
}
.stage.is-dragover{box-shadow:inset 0 0 0 2px var(--accent)}
.stage.is-panning{cursor:grabbing}
.stage.can-pan{cursor:grab}

.canvas-pan{
    position:absolute;top:0;left:0;
    transform-origin:0 0;
    will-change:transform;
}
.canvas-frame{
    position:relative;
    display:none;
    line-height:0;
    background-color:#fff;
    background-image:
        linear-gradient(45deg,#E9EBEE 25%,transparent 25%,transparent 75%,#E9EBEE 75%),
        linear-gradient(45deg,#E9EBEE 25%,transparent 25%,transparent 75%,#E9EBEE 75%);
    background-size:18px 18px;
    background-position:0 0,9px 9px;
    box-shadow:0 18px 45px rgba(0,0,0,.45);
}
canvas{display:block;touch-action:none}

/* inline text editor, lives inside the transformed layer so it scales with zoom */
.text-editor{
    position:absolute;
    margin:0;padding:0;
    border:none;outline:1px dashed rgba(59,130,246,.9);
    background:rgba(255,255,255,.82);
    line-height:1;
    letter-spacing:0;
    min-width:40px;
    z-index:5;
}

/* ---------- Zoom bar ---------- */
.zoombar{
    position:absolute;right:16px;bottom:16px;
    display:none;align-items:center;gap:2px;
    padding:4px;
    border-radius:999px;
    background:rgba(20,22,26,.86);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(6px);
    z-index:20;
}
.zoombar.is-on{display:flex}
.zoom-btn{
    width:28px;height:28px;
    display:grid;place-items:center;
    border:none;border-radius:50%;
    background:transparent;color:var(--stage-ink);
    cursor:pointer;
}
.zoom-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.zoom-btn svg{width:15px;height:15px}
.zoom-level{
    min-width:54px;height:28px;padding:0 6px;
    border:none;border-radius:999px;background:transparent;
    color:#fff;font-family:var(--mono);font-size:11.5px;font-weight:600;
    cursor:pointer;
}
.zoom-level:hover{background:rgba(255,255,255,.12)}

/* ---------- Filmstrip ---------- */
.filmstrip{
    display:none;flex:0 0 auto;
    align-items:center;gap:8px;
    padding:9px 12px;
    background:var(--surface);
    border-top:1px solid var(--line);
    overflow-x:auto;overflow-y:hidden;
}
.filmstrip.is-on{display:flex}
.film-item{
    position:relative;flex:0 0 auto;
    width:86px;height:58px;
    border:1px solid var(--line-strong);border-radius:var(--r-sm);
    background:#EDEFF2;overflow:hidden;cursor:pointer;
    transition:border-color .15s,box-shadow .15s;
}
.film-item img{width:100%;height:100%;object-fit:cover;display:block}
.film-item:hover{border-color:var(--ink-3)}
.film-item.is-active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-ring)}
.film-idx{
    position:absolute;left:4px;top:4px;
    font-family:var(--mono);font-size:9.5px;font-weight:700;
    padding:1px 5px;border-radius:4px;
    background:rgba(16,18,22,.74);color:#fff;
}
.film-badge{
    position:absolute;left:4px;bottom:4px;
    font-family:var(--mono);font-size:9.5px;font-weight:700;
    padding:1px 5px;border-radius:4px;
    background:var(--accent);color:#fff;
}
.film-badge:empty{display:none}
.film-close{
    position:absolute;right:3px;top:3px;
    width:18px;height:18px;padding:0;
    border:none;border-radius:50%;
    background:rgba(16,18,22,.74);color:#fff;
    display:grid;place-items:center;cursor:pointer;
    opacity:0;transition:opacity .12s;
}
.film-close svg{width:11px;height:11px}
.film-close:hover{background:var(--danger)}
.film-item:hover .film-close,.film-item.is-active .film-close{opacity:1}
.film-add{
    flex:0 0 auto;width:58px;height:58px;
    border:1px dashed var(--line-strong);border-radius:var(--r-sm);
    background:transparent;color:var(--ink-3);
    display:grid;place-items:center;cursor:pointer;
}
.film-add:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.film-add:disabled{opacity:.4;cursor:not-allowed}
.film-add svg{width:18px;height:18px}
.film-count{
    flex:0 0 auto;margin-left:auto;padding-left:12px;
    font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;
}

/* ---------- Empty state ---------- */
.empty{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;color:var(--stage-ink);
    padding:24px;overflow:auto;
}
.empty-inner{max-width:560px}
.empty-mark{
    width:54px;height:54px;margin:0 auto 18px;
    display:grid;place-items:center;
    border:1px dashed rgba(255,255,255,.28);
    border-radius:var(--r-lg);
    color:var(--stage-ink-2);
}
.empty-mark svg{width:24px;height:24px}
.empty-title{font-size:19px;font-weight:700;margin:0 0 8px;color:#fff;letter-spacing:-.01em}
.empty-desc{font-size:13px;line-height:1.7;margin:0;color:var(--stage-ink-2)}
.tips{
    margin-top:22px;padding:14px 16px;
    text-align:left;
    border:1px solid var(--stage-line);border-radius:var(--r);
    background:rgba(255,255,255,.035);
}
.tips-title{
    font-size:10px;font-weight:700;letter-spacing:.10em;text-transform:uppercase;
    color:var(--stage-ink-2);margin-bottom:9px;
}
.tips ul{margin:0;padding-left:16px}
.tips li{font-size:12.5px;line-height:1.85;color:var(--stage-ink)}
.tips b{color:#fff;font-weight:600}
kbd{
    font-family:var(--mono);font-size:11px;
    padding:1px 5px;margin:0 1px;
    border-radius:4px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
}

/* =========================================================
   Inspector
   ========================================================= */
.inspector{
    background:var(--surface);
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;
    min-height:0;
}
.panel-scroll{flex:1 1 auto;overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.group{padding:14px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.group-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.group-title{flex:1 1 auto}
.badge{
    font-family:var(--mono);font-size:10px;font-weight:700;
    padding:2px 6px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);
}
.field{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.field:last-child{margin-bottom:0}
.field-label{flex:0 0 74px;font-size:12px;font-weight:600;color:var(--ink-2)}
.field-ctl{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0}

input[type="text"],input[type="number"],select{
    height:30px;padding:0 9px;
    border:1px solid var(--line-strong);
    border-radius:var(--r-sm);
    background:var(--surface);
    font-family:inherit;font-size:12.5px;color:var(--ink);
    outline:none;min-width:0;width:100%;
    transition:border-color .15s,box-shadow .15s;
}
input[type="number"]{font-family:var(--mono);text-align:center;padding:0 4px}
input:focus,select:focus,button:focus-visible,.lang select:focus-visible{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-ring);
}
button:focus-visible{outline:none}
select{
    appearance:none;-webkit-appearance:none;cursor:pointer;
    padding-right:26px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6472' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat;background-position:right 8px center;background-size:13px;
}
select:disabled{background-color:var(--surface-2);color:var(--ink-3);cursor:not-allowed}

input[type="color"]{
    -webkit-appearance:none;appearance:none;
    width:38px;height:30px;padding:0;
    border:1px solid var(--line-strong);border-radius:var(--r-sm);
    background:var(--surface);cursor:pointer;flex:0 0 auto;
}
input[type="color"]::-webkit-color-swatch-wrapper{padding:3px}
input[type="color"]::-webkit-color-swatch{border:none;border-radius:3px}
input[type="color"]::-moz-color-swatch{border:none;border-radius:3px}

input[type="range"]{
    -webkit-appearance:none;appearance:none;
    flex:1 1 auto;min-width:0;height:22px;
    background:transparent;cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line-strong)}
input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:15px;height:15px;margin-top:-6px;border-radius:50%;
    background:var(--surface);border:1.5px solid var(--accent);
    box-shadow:0 1px 2px rgba(0,0,0,.18);
}
input[type="range"]::-moz-range-track{height:3px;border-radius:2px;background:var(--line-strong)}
input[type="range"]::-moz-range-thumb{
    width:13px;height:13px;border-radius:50%;
    background:var(--surface);border:1.5px solid var(--accent);
}
.num-box{flex:0 0 52px}
.readout{flex:0 0 44px;text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* ---------- Layers ---------- */
.layers-group{flex:1 1 auto;display:flex;flex-direction:column;min-height:120px;border-bottom:none}
.layers{
    flex:1 1 auto;overflow-y:auto;min-height:0;
    display:flex;flex-direction:column;gap:3px;
    margin:0 -6px;padding:0 6px;
}
.layer{
    display:flex;align-items:center;gap:8px;
    padding:5px 6px;
    border:1px solid transparent;border-radius:var(--r-sm);
    cursor:pointer;
    transition:background .12s,border-color .12s;
}
.layer:hover{background:var(--surface-2);border-color:var(--line)}
.layer.is-active{background:var(--accent-soft);border-color:rgba(31,111,92,.35)}
.layer-swatch{
    width:16px;height:16px;border-radius:4px;flex:0 0 auto;
    border:1px solid rgba(0,0,0,.14);
}
.layer-icon{width:15px;height:15px;color:var(--ink-2);flex:0 0 auto}
.layer.is-active .layer-icon{color:var(--accent)}
.layer-name{
    flex:1 1 auto;min-width:0;
    font-size:12px;font-weight:600;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.layer-acts{display:flex;gap:1px;flex:0 0 auto;opacity:0;transition:opacity .12s}
.layer:hover .layer-acts,.layer.is-active .layer-acts{opacity:1}
.layer-btn{
    width:22px;height:22px;display:grid;place-items:center;
    border:none;border-radius:4px;background:transparent;
    color:var(--ink-3);cursor:pointer;
}
.layer-btn:hover{background:rgba(0,0,0,.07);color:var(--ink)}
.layer-btn.is-danger:hover{background:var(--danger-soft);color:var(--danger)}
.layer-btn svg{width:13px;height:13px}
.layer-btn:disabled{opacity:.3;cursor:not-allowed}
.layers-empty{
    padding:14px 4px;text-align:center;
    font-size:11.5px;color:var(--ink-3);
}

/* ---------- Export ---------- */
.export{
    flex:0 0 auto;
    padding:14px 16px;
    background:var(--surface-2);
    border-top:1px solid var(--line);
}
.fmt-box{flex:0 0 90px}
.export .btn-primary{width:100%;height:36px;margin-top:12px}

/* =========================================================
   Status bar
   ========================================================= */
.statusbar{
    display:flex;align-items:center;gap:14px;
    padding:0 14px;
    background:var(--surface);
    border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink-3);
    min-width:0;
}
.status-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
.status-item b{color:var(--ink);font-weight:600}
.status-hint{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.status-right{margin-left:auto;font-family:var(--mono);white-space:nowrap}

/* =========================================================
   Modal
   ========================================================= */
.modal-backdrop{
    position:fixed;inset:0;z-index:1000;
    background:rgba(16,18,22,.55);
    display:none;align-items:center;justify-content:center;
    padding:20px;
}
.modal-backdrop.is-open{display:flex}
.modal{
    width:100%;max-width:400px;
    background:var(--surface);
    border-radius:var(--r-lg);
    box-shadow:0 24px 60px rgba(0,0,0,.30);
    padding:22px;
}
.modal h3{margin:0 0 8px;font-size:15px;font-weight:700}
.modal p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* =========================================================
   Responsive
   ========================================================= */
@media (max-width:1180px){
    :root{--panel:258px}
    .brand-tagline{display:none}
    .filechip{max-width:270px}
}

@media (max-width:900px){
    :root{--top:52px}
    .app{grid-template-rows:var(--top) 1fr}
    .statusbar{display:none}
    .float-tip{display:none !important}

    .workspace{grid-template-columns:1fr;grid-template-rows:1fr auto auto}
    .brand-text{display:none}
    .filechip{max-width:none;flex:1 1 auto}
    .topbar{gap:10px;padding:0 10px}
    .topbar-divider{display:none}
    .lang select{padding-right:16px;font-size:11px;max-width:62px}
    .lang{padding:0 4px 0 7px}

    .center{order:1}
    .zoombar{right:10px;bottom:10px}

    .inspector{
        order:2;flex-direction:row;
        border-left:none;border-top:1px solid var(--line);
        overflow-x:auto;overflow-y:hidden;
        -webkit-overflow-scrolling:touch;
    }
    .panel-scroll{display:flex;flex-direction:row;overflow:visible;flex:0 0 auto}
    .group{
        display:flex;flex-direction:row;align-items:flex-end;gap:12px;
        padding:8px 12px;
        border-bottom:none;border-right:1px solid var(--line);
        flex:0 0 auto;
    }
    .group-head{display:none}
    .field{flex-direction:column;align-items:flex-start;gap:3px;margin-bottom:0;flex:0 0 auto}
    .field-label{flex:0 0 auto;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
    .field-ctl{width:auto}
    input[type="range"]{width:96px;flex:0 0 auto}
    .num-box{flex:0 0 46px;width:46px}
    .fmt-box{flex:0 0 78px;width:78px}
    #fileNameInput{width:130px}
    #textToDraw{width:150px}

    .layers-group{min-height:0;align-items:stretch}
    .layers{flex-direction:row;gap:6px;margin:0;padding:0;overflow-x:auto;overflow-y:hidden}
    .layer{width:170px;flex:0 0 auto}
    .layer-acts{opacity:1}
    .layers-empty{padding:10px 14px;white-space:nowrap}

    .export{
        display:flex;flex-direction:row;align-items:flex-end;gap:12px;
        padding:8px 12px;border-top:none;background:var(--surface);flex:0 0 auto;
    }
    .export .btn-primary{width:auto;margin-top:0;height:30px;padding:0 14px}

    .rail{
        order:3;flex-direction:row;justify-content:flex-start;
        gap:2px;padding:6px 8px;
        border-right:none;border-top:1px solid var(--line);
        overflow-x:auto;overflow-y:hidden;
        padding-bottom:calc(6px + env(safe-area-inset-bottom));
    }
    .rail::after{display:none}
    .rail-label{display:none}
    .mode-btn{flex-direction:column;gap:2px;width:auto;min-width:52px;height:44px;padding:0 6px}
    .mode-btn svg{width:18px;height:18px}
    .mode-btn.active::before{display:none}
    .rail .tool-tip{
        display:block;
        font-size:9px;font-weight:600;
        max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }

    .filmstrip{padding:6px 8px;gap:6px}
    .film-item{width:66px;height:46px}
    .film-add{width:44px;height:46px}
    .film-count{display:none}
    .empty-mark{width:44px;height:44px;margin-bottom:12px}
    .empty-title{font-size:16px}
    .empty-desc{font-size:12px}
    .tips{margin-top:14px;padding:11px 12px}
    .tips li{font-size:11.5px;line-height:1.7}
}

@media (max-width:900px) and (max-height:640px){
    .tips{display:none}
}

@media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>

<div class="app">

    <!-- ===================== Top bar ===================== -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/>
                </svg>
            </span>
            <span class="brand-text">
                <span class="brand-name">PicMark</span>
                <span class="brand-tagline" id="tagline">截圖標註工作台</span>
            </span>
        </div>

        <button class="btn" id="loadBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/>
            </svg>
            <span id="btnLoad">載入圖片</span>
        </button>
        <input type="file" id="imageLoader" accept="image/*" multiple class="sr-only">

        <span class="topbar-divider"></span>

        <div class="filechip" id="fileChip">
            <span class="chip-dot"></span>
            <span class="chip-name" id="chipName">尚未載入圖片</span>
            <span class="chip-dim mono" id="chipDim"></span>
            <span class="chip-index mono" id="chipIndex"></span>
        </div>

        <div class="topbar-actions">
            <button class="btn btn-icon has-tip" data-tip-pos="bottom" data-key="Ctrl Z" id="undoBtn">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 8L5 12l4 4"/><path d="M5 12h9a5 5 0 010 10h-2"/>
                </svg>
                <span class="tool-tip" id="btnUndo">上一步</span>
            </button>
            <button class="btn btn-icon has-tip" data-tip-pos="bottom" data-key="Ctrl ⇧ Z" id="redoBtn" disabled>
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 8l4 4-4 4"/><path d="M19 12h-9a5 5 0 000 10h2"/>
                </svg>
                <span class="tool-tip" id="btnRedo">下一步</span>
            </button>
            <button class="btn btn-icon is-danger has-tip" data-tip-pos="bottom" id="clearBtn">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 7h16M10 7V5h4v2M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/>
                </svg>
                <span class="tool-tip" id="btnClear">全清除</span>
            </button>

            <span class="topbar-divider"></span>

            <div class="lang">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15 0 18-2.6-3-2.6-15.4 0-18z"/>
                </svg>
                <select id="langSelect" aria-label="Language">
                    <option value="zh-TW">繁體中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="es">Español</option>
                </select>
            </div>
        </div>
    </header>

    <!-- ===================== Workspace ===================== -->
    <div class="workspace">

        <!-- Tool rail -->
        <nav class="rail">
            <span class="eyebrow rail-label" id="lblTool">工具</span>

            <button class="mode-btn active has-tip" data-key="1" id="btnToolSelect" data-mode="select">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
                    <path d="M5.5 3.5l13 7.2-5.7 1.5-2.6 5.4z"/>
                </svg>
                <span class="tool-tip" id="txtToolSelect">選擇與移動</span>
            </button>

            <button class="mode-btn has-tip" data-key="2" id="btnToolMarker" data-mode="marker">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8.2"/><path d="M10.6 9.9L12.6 8.6V16"/>
                </svg>
                <span class="tool-tip" id="txtToolMarker">數字標記</span>
            </button>

            <button class="mode-btn has-tip" data-key="3" id="btnToolText" data-mode="text">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M5 7V5h14v2M12 5v14M9.5 19h5"/>
                </svg>
                <span class="tool-tip" id="txtToolText">文字標記</span>
            </button>

            <button class="mode-btn has-tip" data-key="4" id="btnToolRect" data-mode="rect">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <rect x="4.2" y="6.2" width="15.6" height="11.6" rx="1.6"/>
                </svg>
                <span class="tool-tip" id="txtToolRect">矩形</span>
            </button>

            <button class="mode-btn has-tip" data-key="5" id="btnToolCircle" data-mode="circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="12" cy="12" r="7.8"/>
                </svg>
                <span class="tool-tip" id="txtToolCircle">圓形</span>
            </button>

            <button class="mode-btn has-tip" data-key="6" id="btnToolArrow" data-mode="arrow">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 19L18.5 5.5M18.5 5.5h-7.2M18.5 5.5v7.2"/>
                </svg>
                <span class="tool-tip" id="txtToolArrow">箭頭</span>
            </button>

            <button class="mode-btn has-tip" data-key="7" id="btnToolLine" data-mode="line">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <path d="M5 18.5L19 5.5"/>
                </svg>
                <span class="tool-tip" id="txtToolLine">直線</span>
            </button>

            <button class="mode-btn has-tip" data-key="8" id="btnToolBlur" data-mode="blur">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1" fill="currentColor" stroke="none"/>
                    <rect x="4" y="14" width="6" height="6" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="14" width="6" height="6" rx="1"/>
                </svg>
                <span class="tool-tip" id="txtToolBlur">馬賽克</span>
            </button>
        </nav>

        <!-- Stage + filmstrip -->
        <div class="center">
        <main class="stage" id="dropZone">
            <div class="canvas-pan" id="canvasPan">
                <div class="canvas-frame" id="canvasWrapper">
                    <canvas id="imageCanvas"></canvas>
                    <input type="text" class="text-editor" id="textEditor" style="display:none">
                </div>
            </div>

            <div class="empty" id="placeholder">
                <div class="empty-inner">
                    <div class="empty-mark">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M3.5 17l4.8-4.4 3.4 3 3-2.6 5.8 5"/>
                        </svg>
                    </div>
                    <div id="placeholderText"></div>
                </div>
            </div>

            <div class="zoombar" id="zoomBar">
                <button class="zoom-btn has-tip" id="zoomOutBtn" data-tip-pos="top">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
                    <span class="tool-tip" id="tipZoomOut">縮小</span>
                </button>
                <button class="zoom-level has-tip" id="zoomLevel" data-tip-pos="top">100%<span class="tool-tip" id="tipZoomFit">符合視窗</span></button>
                <button class="zoom-btn has-tip" id="zoomInBtn" data-tip-pos="top">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                    <span class="tool-tip" id="tipZoomIn">放大</span>
                </button>
                <button class="zoom-btn has-tip" id="zoomOneBtn" data-tip-pos="top">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/>
                    </svg>
                    <span class="tool-tip" id="tipZoomOne">實際大小 100%</span>
                </button>
            </div>
        </main>

        <div class="filmstrip" id="filmstrip"></div>
        </div>

        <!-- Inspector -->
        <aside class="inspector">
            <div class="panel-scroll">

                <section class="group">
                    <div class="group-head">
                        <span class="eyebrow group-title" id="grpStyle">外觀</span>
                        <span class="badge" id="selBadge" style="display:none">選取中</span>
                    </div>

                    <div class="field">
                        <span class="field-label" id="lblColor">顏色</span>
                        <div class="field-ctl"><input type="color" id="primaryColor" value="#cc0000"></div>
                    </div>

                    <div class="field">
                        <span class="field-label" id="lblThickness">粗細</span>
                        <div class="field-ctl">
                            <input type="range" id="brushSizeRange" min="2" max="100" value="30">
                            <input type="number" class="num-box" id="brushSize" value="30" min="2" max="400">
                        </div>
                    </div>

                    <div class="field">
                        <span class="field-label" id="lblOpacity">不透明度</span>
                        <div class="field-ctl">
                            <input type="range" id="brushOpacity" min="10" max="100" value="100">
                            <span class="readout" id="opacityVal">100%</span>
                        </div>
                    </div>

                    <div class="field">
                        <span class="field-label" id="lblFillStyle">樣式</span>
                        <div class="field-ctl">
                            <select id="fillStyleSelect">
                                <option value="stroke" id="optStroke">空心 (框線)</option>
                                <option value="fill" id="optFill">實心 (填滿)</option>
                            </select>
                        </div>
                    </div>
                </section>

                <section class="group" id="numberParamsGroup" style="display:none">
                    <div class="group-head"><span class="eyebrow group-title" id="grpMarker">數字標記</span></div>
                    <div class="field" id="nextNumField">
                        <span class="field-label" id="lblStartNum">下一個數字</span>
                        <div class="field-ctl"><input type="number" class="num-box" id="startNum" value="1" min="0"></div>
                    </div>
                    <div class="field" id="markerNumField" style="display:none">
                        <span class="field-label" id="lblMarkerNum">這個標記</span>
                        <div class="field-ctl"><input type="number" class="num-box" id="markerNum" value="1" min="0"></div>
                    </div>
                    <div class="field">
                        <span class="field-label" id="lblTextColor">字色</span>
                        <div class="field-ctl"><input type="color" id="textColor" value="#ffffff"></div>
                    </div>
                </section>

                <section class="group" id="textParamsGroup" style="display:none">
                    <div class="group-head"><span class="eyebrow group-title" id="grpText">文字內容</span></div>
                    <div class="field">
                        <span class="field-label" id="lblTextInput">輸入文字</span>
                        <div class="field-ctl"><input type="text" id="textToDraw" placeholder="輸入文字..."></div>
                    </div>
                </section>

                <section class="group layers-group">
                    <div class="group-head">
                        <span class="eyebrow group-title" id="grpLayers">圖層</span>
                        <span class="badge mono" id="layerCount">0</span>
                    </div>
                    <div class="layers" id="layerList"></div>
                </section>

            </div>

            <footer class="export">
                <div class="group-head"><span class="eyebrow group-title" id="grpExport">匯出</span></div>
                <div class="field">
                    <span class="field-label" id="lblFileName">檔名</span>
                    <div class="field-ctl"><input type="text" id="fileNameInput" value="picmark_image" placeholder="請輸入自訂檔名"></div>
                </div>
                <div class="field">
                    <span class="field-label" id="lblFormat">格式</span>
                    <div class="field-ctl">
                        <select id="exportFormat" class="fmt-box">
                            <option value="image/png">PNG</option>
                            <option value="image/jpeg">JPG</option>
                        </select>
                    </div>
                </div>
                <div class="field" id="qualityField" style="display:none">
                    <span class="field-label" id="lblQuality">JPG 品質</span>
                    <div class="field-ctl">
                        <input type="range" id="jpgQuality" min="40" max="100" value="90">
                        <span class="readout" id="qualityVal">90%</span>
                    </div>
                </div>
                <button class="btn btn-primary" id="downloadBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 4v12M8 12l4 4 4-4"/><path d="M4 20h16"/>
                    </svg>
                    <span id="btnDownload">下載圖片</span>
                </button>
                <button class="btn" id="downloadAllBtn" style="display:none">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3h9a2 2 0 012 2v9"/><rect x="3" y="8" width="13" height="13" rx="2"/>
                    </svg>
                    <span id="btnDownloadAll">匯出全部</span>
                </button>
            </footer>
        </aside>
    </div>

    <!-- ===================== Status bar ===================== -->
    <footer class="statusbar">
        <span class="status-item"><span id="statusToolLabel">目前工具</span> <b id="statusTool">選擇與移動</b></span>
        <span class="status-item status-hint" id="statusHint"></span>
        <span class="status-right" id="statusDims"></span>
    </footer>
</div>

<!-- floating tooltip -->
<div class="float-tip" id="floatTip"><span id="floatTipText"></span></div>

<!-- confirm modal -->
<div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true">
        <h3 id="modalTitle"></h3>
        <p id="modalMsg"></p>
        <div class="modal-actions" id="modalActions"></div>
    </div>
</div>

<script>

        placeholderHtml:`

            <p class="empty-desc">按上方「載入圖片」選檔案、把圖片拖進這個區域，或直接用 <kbd>Ctrl</kbd><kbd>V</kbd> 貼上截圖。</p>

        txtToolCircle:"圆形", txtToolArrow:"箭头", txtToolLine:"直线", txtToolBlur:"马赛克",

/* =========================================================
   Floating tooltips (item 1)
   ========================================================= */
let tipTarget = null;
function showTip(el){
    const label = el.querySelector('.tool-tip');
    if (!label) return;
    tipTarget = el;
    floatTipText.textContent = label.textContent;
    const key = el.getAttribute('data-key');
    const old = floatTip.querySelector('.tip-key');
    if (old) old.remove();
    if (key){
        const k = document.createElement('span');
        k.className = 'tip-key';
        k.textContent = key;
        floatTip.appendChild(k);
    }
    floatTip.style.display = 'flex';
    floatTip.style.visibility = 'hidden';

    const r = el.getBoundingClientRect();
    const t = floatTip.getBoundingClientRect();
    const pos = el.getAttribute('data-tip-pos') || 'right';
    let x, y;
    if (pos === 'bottom'){ x = r.left + r.width/2 - t.width/2; y = r.bottom + 8; }
    else if (pos === 'top'){ x = r.left + r.width/2 - t.width/2; y = r.top - t.height - 8; }
    else { x = r.right + 12; y = r.top + r.height/2 - t.height/2; }
    x = Math.max(8, Math.min(x, window.innerWidth - t.width - 8));
    y = Math.max(8, Math.min(y, window.innerHeight - t.height - 8));
    floatTip.style.left = x + 'px';
    floatTip.style.top = y + 'px';
    floatTip.style.visibility = 'visible';
}
function hideTip(){ floatTip.style.display = 'none'; tipTarget = null; }

/* =========================================================
   View transform: zoom & pan (items 2, 3)
   ========================================================= */
function applyTransform(){
    canvasPan.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    zoomLevelBtn.firstChild.nodeValue = Math.round(zoom * 100) + '%';
    if (editingObj) positionTextEditor(editingObj);
}
function clampZoom(z){ return Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, z)); }

function fitToView(){
    if (!loadedImage) return;
    const pad = 48;
    const w = Math.max(50, stage.clientWidth - pad);
    const h = Math.max(50, stage.clientHeight - pad);
    zoom = clampZoom(Math.min(w / canvas.width, h / canvas.height));
    panX = (stage.clientWidth - canvas.width * zoom) / 2;
    panY = (stage.clientHeight - canvas.height * zoom) / 2;
    autoFit = true;
    applyTransform();
    drawAll();
}
function zoomAt(clientX, clientY, factor){
    const r = stage.getBoundingClientRect();
    const mx = clientX - r.left, my = clientY - r.top;
    const nz = clampZoom(zoom * factor);
    if (nz === zoom) return;
    panX = mx - (mx - panX) * (nz / zoom);
    panY = my - (my - panY) * (nz / zoom);
    zoom = nz;
    autoFit = false;
    applyTransform();
    drawAll();
}
function zoomCenter(factor){
    const r = stage.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
}
function zoomTo(z){
    const r = stage.getBoundingClientRect();
    zoomAt(r.left + r.width / 2, r.top + r.height / 2, z / zoom);
}

document.getElementById('zoomInBtn').addEventListener('click', () => zoomCenter(1.25));
document.getElementById('zoomOutBtn').addEventListener('click', () => zoomCenter(1 / 1.25));
document.getElementById('zoomOneBtn').addEventListener('click', () => zoomTo(1));
zoomLevelBtn.addEventListener('click', fitToView);

stage.addEventListener('wheel', function(e){
    if (!loadedImage) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey){
        zoomAt(e.clientX, e.clientY, Math.pow(0.9988, e.deltaY));
    } else {
        panX -= e.shiftKey ? e.deltaY : e.deltaX;
        panY -= e.shiftKey ? 0 : e.deltaY;
        autoFit = false;
        applyTransform();
    }
}, { passive:false });

// space / middle-button panning
stage.addEventListener('pointerdown', function(e){
    if (!loadedImage) return;
    if (!(isSpaceDown || e.button === 1)) return;
    e.preventDefault();
    isPanning = true;
    panStartX = e.clientX; panStartY = e.clientY;
    panOriginX = panX; panOriginY = panY;
    stage.setPointerCapture(e.pointerId);
    stage.classList.add('is-panning');
});
stage.addEventListener('pointermove', function(e){
    if (!isPanning) return;
    panX = panOriginX + (e.clientX - panStartX);
    panY = panOriginY + (e.clientY - panStartY);
    autoFit = false;
    applyTransform();
});
function endPan(){ isPanning = false; stage.classList.remove('is-panning'); }
stage.addEventListener('pointerup', endPan);
stage.addEventListener('pointercancel', endPan);

window.addEventListener('resize', function(){ if (autoFit) fitToView(); });

function layerName(obj){
    const base = dict()[TYPE_KEY[obj.type]] || obj.type;
    if (obj.type === 'marker') return base + ' #' + obj.text;
    if (obj.type === 'text'){
        const t = String(obj.text || '');

/* ---------- document switching ---------- */
function syncActiveDoc(){
    const doc = docs[activeIndex];
    if (!doc) return;
    doc.objects = objects;
    doc.history = history;
    doc.redoStack = redoStack;
    doc.nextNumber = nextNumber;
    doc.zoom = zoom; doc.panX = panX; doc.panY = panY; doc.autoFit = autoFit;
    doc.fileName = fileNameInput.value;
}

function activateDoc(i){
    if (i < 0 || i >= docs.length) return;
    commitTextEditor(false);
    syncActiveDoc();

    activeIndex = i;
    const doc = docs[i];

    loadedImage = doc.img;
    objects = doc.objects;
    history = doc.history;
    redoStack = doc.redoStack;
    nextNumber = doc.nextNumber;
    zoom = doc.zoom; panX = doc.panX; panY = doc.panY; autoFit = doc.autoFit;
    selectedObject = null;

    canvas.width = doc.img.naturalWidth;
    canvas.height = doc.img.naturalHeight;
    canvas.style.width = doc.img.naturalWidth + 'px';
    canvas.style.height = doc.img.naturalHeight + 'px';

    fileNameInput.value = doc.fileName;
    placeholder.style.display = 'none';
    canvasWrapper.style.display = 'block';
    zoomBar.classList.add('is-on');

    updateNextNumberInput();
    updateFileChip();

    if (doc.needFit){ doc.needFit = false; fitToView(); }
    else { applyTransform(); drawAll(); }

    refreshUI();
    renderFilmstrip();
}

function addDocument(img, name){
    docs.push({
        img: img,
        fileName: name,
        objects: [],
        history: [JSON.stringify({ o: [], n: 1 })],
        redoStack: [],
        nextNumber: 1,
        zoom: 1, panX: 0, panY: 0, autoFit: true,
        needFit: true
    });
    activateDoc(docs.length - 1);
}

function baseNameOf(fileName){
    if (!fileName) return 'picmark_image';
    const dot = fileName.lastIndexOf('.');
    return (dot > 0 ? fileName.substring(0, dot) : fileName) + '_marked';
}

function addImages(fileList){
    const list = Array.prototype.slice.call(fileList).filter(function(f){ return f.type && f.type.indexOf('image/') === 0; });
    if (!list.length) return;

    const room = Math.max(0, MAX_DOCS - docs.length);
    const take = list.slice(0, room);
    const skipped = list.length - take.length;

    let i = 0;
    (function next(){
        if (i >= take.length){
            if (skipped > 0){
                openDialog(dict().limitTitle,
                    dict().limitMsg.replace('{max}', MAX_DOCS).replace('{n}', skipped),
                    [{ label: dict().btnOk, primary: true }]);
            }
            return;
        }
        const file = take[i++];
        const reader = new FileReader();
        reader.onload = function(ev){
            const img = new Image();
            img.onload = function(){ addDocument(img, baseNameOf(file.name)); next(); };
            img.onerror = next;
            img.src = ev.target.result;
        };
        reader.onerror = next;
        reader.readAsDataURL(file);
    })();
}

function closeDoc(i){
    if (i < 0 || i >= docs.length) return;
    syncActiveDoc();
    const doc = docs[i];
    if (doc.objects.length){
        openDialog(dict().closeTitle,
            dict().closeMsg.replace('{name}', doc.fileName).replace('{n}', doc.objects.length),
            [{ label: dict().btnCancel }, { label: dict().btnClose, primary: true, cb: function(){ removeDoc(i); } }]);
    } else {
        removeDoc(i);
    }
}

function removeDoc(i){
    docs.splice(i, 1);
    if (!docs.length){ resetToEmpty(); return; }
    const target = Math.min(i, docs.length - 1);
    activeIndex = -1;               // nothing to stash back into
    activateDoc(target);
}

function resetToEmpty(){
    activeIndex = -1;
    loadedImage = null;
    objects = []; history = []; redoStack = [];
    selectedObject = null;
    nextNumber = 1;
    startNumInput.value = 1;
    canvasWrapper.style.display = 'none';

    renderFilmstrip();
}

/* =========================================================
   Rendering
   ========================================================= */
function textMetrics(obj){
    ctx.save();
    ctx.font = 'bold ' + obj.size + 'px ' + CANVAS_FONT;
    const w = ctx.measureText(String(obj.text || ' ')).width;
    ctx.restore();
    return { w: w, h: obj.size };
}

function circleBBox(obj){
    const r = Math.max(Math.abs(obj.x2 - obj.x1), Math.abs(obj.y2 - obj.y1)) / 2;
    const cx = obj.x1 + (obj.x2 > obj.x1 ? r : -r);
    const cy = obj.y1 + (obj.y2 > obj.y1 ? r : -r);
    return { minX: cx - r, minY: cy - r, maxX: cx + r, maxY: cy + r, cx: cx, cy: cy, r: r };
}

function drawAll(){
    if (!loadedImage) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(loadedImage, 0, 0);

    objects.forEach(obj => {
        if (obj === editingObj) return;

        ctx.save();
        ctx.strokeStyle = obj.color;
        ctx.fillStyle = obj.color;
        ctx.lineWidth = obj.size;
        ctx.globalAlpha = obj.opacity;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const isFill = obj.fillStyle === 'fill';

        if (obj.type === 'rect'){
            if (isFill) ctx.fillRect(obj.x1, obj.y1, obj.x2 - obj.x1, obj.y2 - obj.y1);
            else ctx.strokeRect(obj.x1, obj.y1, obj.x2 - obj.x1, obj.y2 - obj.y1);
        }
        else if (obj.type === 'circle'){
            const b = circleBBox(obj);
            ctx.beginPath();
            ctx.arc(b.cx, b.cy, b.r, 0, 2 * Math.PI);
            if (isFill) ctx.fill(); else ctx.stroke();
        }
        else if (obj.type === 'line'){
            ctx.beginPath();
            ctx.moveTo(obj.x1, obj.y1);
            ctx.lineTo(obj.x2, obj.y2);
            ctx.stroke();
        }
        else if (obj.type === 'arrow'){
            drawArrowHead(obj.x1, obj.y1, obj.x2, obj.y2, obj.size);
        }
        else if (obj.type === 'blur'){
            drawMosaicPixel(obj.x1, obj.y1, obj.x2 - obj.x1, obj.y2 - obj.y1, obj.size, obj.opacity);
        }
        else if (obj.type === 'marker'){
            const radius = obj.size / 2;
            ctx.beginPath();
            ctx.arc(obj.x1, obj.y1, radius, 0, 2 * Math.PI);
            ctx.fill();
            ctx.fillStyle = obj.textColor;
            ctx.font = 'bold ' + radius + 'px ' + CANVAS_FONT;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(obj.text, obj.x1, obj.y1 + (radius * 0.05));
        }
        else if (obj.type === 'text'){
            ctx.font = 'bold ' + obj.size + 'px ' + CANVAS_FONT;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(obj.text, obj.x1, obj.y1);
        }
        ctx.restore();
    });

    if (currentMode === 'select' && selectedObject && objects.indexOf(selectedObject) !== -1 && selectedObject !== editingObj){
        drawSelection(selectedObject);
    }
}

function drawSelection(obj){
    const k = 1 / zoom;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 1.6 * k;
    ctx.setLineDash([6 * k, 4 * k]);

    if (obj.type === 'marker'){
        ctx.beginPath();
        ctx.arc(obj.x1, obj.y1, obj.size / 2 + 4 * k, 0, 2 * Math.PI);
        ctx.stroke();
    } else if (obj.type === 'text'){
        const m = textMetrics(obj);
        ctx.strokeRect(obj.x1 - 4 * k, obj.y1 - 4 * k, m.w + 8 * k, m.h + 8 * k);
    } else if (obj.type === 'circle'){
        const b = circleBBox(obj);
        ctx.strokeRect(b.minX - 4 * k, b.minY - 4 * k, (b.maxX - b.minX) + 8 * k, (b.maxY - b.minY) + 8 * k);
    } else {
        const minX = Math.min(obj.x1, obj.x2), minY = Math.min(obj.y1, obj.y2);
        const maxX = Math.max(obj.x1, obj.x2), maxY = Math.max(obj.y1, obj.y2);
        ctx.strokeRect(minX - 5 * k, minY - 5 * k, (maxX - minX) + 10 * k, (maxY - minY) + 10 * k);
    }

    // resize handles (item 7)
    ctx.setLineDash([]);
    ctx.lineWidth = 1.4 * k;
    ctx.strokeStyle = '#1d4ed8';
    ctx.fillStyle = '#ffffff';
    const s = 4.5 * k;
    getHandles(obj).forEach(h => {
        ctx.beginPath();
        ctx.rect(h.x - s, h.y - s, s * 2, s * 2);
        ctx.fill();
        ctx.stroke();
    });
    ctx.restore();
}

/* =========================================================
   Handles (item 7)
   ========================================================= */
function getHandles(obj){
    if (obj.type === 'line' || obj.type === 'arrow'){
        return [{ n:'p1', x:obj.x1, y:obj.y1 }, { n:'p2', x:obj.x2, y:obj.y2 }];
    }
    if (obj.type === 'marker'){
        const r = obj.size / 2;
        return [{ n:'size', x:obj.x1 + r * 0.7071, y:obj.y1 + r * 0.7071 }];
    }
    if (obj.type === 'text'){
        const m = textMetrics(obj);
        return [{ n:'size', x:obj.x1 + m.w, y:obj.y1 + m.h }];
    }
    let b;
    if (obj.type === 'circle') b = circleBBox(obj);
    else b = {
        minX: Math.min(obj.x1, obj.x2), maxX: Math.max(obj.x1, obj.x2),
        minY: Math.min(obj.y1, obj.y2), maxY: Math.max(obj.y1, obj.y2)
    };
    return [
        { n:'nw', x:b.minX, y:b.minY }, { n:'ne', x:b.maxX, y:b.minY },
        { n:'sw', x:b.minX, y:b.maxY }, { n:'se', x:b.maxX, y:b.maxY }
    ];
}

function findHandleAt(x, y){
    if (currentMode !== 'select' || !selectedObject) return null;
    const t = 7 / zoom;
    const hs = getHandles(selectedObject);
    for (let i = 0; i < hs.length; i++){
        if (Math.abs(x - hs[i].x) <= t && Math.abs(y - hs[i].y) <= t) return hs[i].n;
    }
    return null;
}

function resizeObject(obj, h, pos){
    if (h === 'p1'){ obj.x1 = pos.x; obj.y1 = pos.y; return; }
    if (h === 'p2'){ obj.x2 = pos.x; obj.y2 = pos.y; return; }
    if (obj.type === 'marker'){
        const d = Math.sqrt(Math.pow(pos.x - obj.x1, 2) + Math.pow(pos.y - obj.y1, 2));
        obj.size = Math.max(6, Math.round(d * 2));
        return;
    }
    if (obj.type === 'text'){
        obj.size = Math.max(6, Math.round(pos.y - obj.y1));
        return;
    }
    if (obj.type === 'circle'){
        const b = circleBBox(obj);
        const fx = h.indexOf('w') !== -1 ? b.maxX : b.minX;
        const fy = h.charAt(0) === 'n' ? b.maxY : b.minY;
        const s = Math.max(Math.abs(pos.x - fx), Math.abs(pos.y - fy));
        obj.x1 = fx; obj.y1 = fy;
        obj.x2 = fx + (pos.x >= fx ? s : -s);
        obj.y2 = fy + (pos.y >= fy ? s : -s);
        return;
    }
    let minX = Math.min(obj.x1, obj.x2), maxX = Math.max(obj.x1, obj.x2);
    let minY = Math.min(obj.y1, obj.y2), maxY = Math.max(obj.y1, obj.y2);
    if (h.indexOf('w') !== -1) minX = pos.x; else maxX = pos.x;
    if (h.charAt(0) === 'n') minY = pos.y; else maxY = pos.y;
    obj.x1 = Math.min(minX, maxX); obj.x2 = Math.max(minX, maxX);
    obj.y1 = Math.min(minY, maxY); obj.y2 = Math.max(minY, maxY);
}

/* =========================================================
   History
   ========================================================= */
function snapshot(){ return JSON.stringify({ o: objects, n: nextNumber }); }
function restoreSnapshot(str){
    const state = JSON.parse(str);
    objects = state.o || [];
    nextNumber = typeof state.n === 'number' ? state.n : 1;
    startNumInput.value = nextNumber;
}

function saveHistory(){
    history.push(snapshot());
    if (history.length > 80) history.shift();
    redoStack = [];
    updateButtons();
    renderLayers();
    updateFilmCounts();
}
function updateButtons(){
    undoBtn.disabled = history.length <= 1;
    redoBtn.disabled = redoStack.length === 0;
}
// Markers keep whatever number they were given; nothing is renumbered
// behind the user's back. This is what allows two markers to share a number.
function updateNextNumberInput(){ startNumInput.value = nextNumber; }
function handleUndo(){
    if (history.length > 1){
        redoStack.push(history.pop());
        restoreSnapshot(history[history.length - 1]);
        selectedObject = null;
        refreshUI();
        drawAll();
    }
}
function handleRedo(){
    if (redoStack.length > 0){
        const next = redoStack.pop();
        history.push(next);
        restoreSnapshot(next);
        selectedObject = null;
        refreshUI();
        drawAll();
    }
}
undoBtn.addEventListener('click', handleUndo);
redoBtn.addEventListener('click', handleRedo);
clearBtn.addEventListener('click', function(){
    if (!loadedImage || !objects.length) return;
    objects = [];
    selectedObject = null;
    nextNumber = 1;
    startNumInput.value = 1;
    saveHistory();
    refreshUI();
    drawAll();
});

// 1) the number the NEXT marker will get; left alone it just keeps counting up
startNumInput.addEventListener('input', function(){
    const v = parseInt(startNumInput.value, 10);
    if (isNaN(v)) return;
    nextNumber = v;
    // the counter is part of the saved state, so keep the current history
    // entry in step — otherwise undo would jump back to an older counter
    if (history.length) history[history.length - 1] = snapshot();
});

// 2) the number of the marker that is currently selected — duplicates allowed
markerNumInput.addEventListener('input', function(){
    if (!selectedObject || selectedObject.type !== 'marker') return;
    const v = parseInt(markerNumInput.value, 10);
    if (isNaN(v)) return;
    selectedObject.text = v;
    drawAll();
    renderLayers();
});
markerNumInput.addEventListener('change', commitPropChange);

/* =========================================================
   Keyboard
   ========================================================= */
window.addEventListener('keydown', function(e){
    if (e.code === 'Space' && !isTypingTarget(e.target)){
        if (!isSpaceDown){ isSpaceDown = true; stage.classList.add('can-pan'); updateCanvasCursor(); }
        e.preventDefault();
        return;
    }

    if (isTypingTarget(e.target)) return;

    const isCmdOrCtrl = e.metaKey || e.ctrlKey;
    if (isCmdOrCtrl){
        if (e.key.toLowerCase() === 'z'){
            e.preventDefault();
            if (e.shiftKey) handleRedo(); else handleUndo();
            return;
        }
        if (e.key.toLowerCase() === 'y'){ e.preventDefault(); handleRedo(); return; }
        if (e.key === '0'){ e.preventDefault(); fitToView(); return; }
    }

    if (KEY_TO_MODE[e.key]){ e.preventDefault(); setMode(KEY_TO_MODE[e.key]); return; }
    if (e.key === '0'){ e.preventDefault(); fitToView(); return; }
    if (e.key === '+' || e.key === '='){ e.preventDefault(); zoomCenter(1.25); return; }
    if (e.key === '-' || e.key === '_'){ e.preventDefault(); zoomCenter(1 / 1.25); return; }

    if (e.key === '[' || e.key === ']'){
        if (docs.length > 1){
            e.preventDefault();
            const step = e.key === ']' ? 1 : -1;
            activateDoc((activeIndex + step + docs.length) % docs.length);
        }
        return;
    }

    if (e.key === 'Escape'){
        if (modal.classList.contains('is-open')){ closeModal(); return; }
        setSelection(null); drawAll(); return;
    }

    if ((e.key === 'Delete' || e.key === 'Backspace') && currentMode === 'select' && selectedObject){
        e.preventDefault();
        objects = objects.filter(o => o !== selectedObject);
        selectedObject = null;
        saveHistory();
        refreshUI();
        drawAll();
    }
});
window.addEventListener('keyup', function(e){
    if (e.code === 'Space'){ isSpaceDown = false; stage.classList.remove('can-pan'); updateCanvasCursor(); }
});

/* =========================================================
   Hit testing
   ========================================================= */
function findObjectAt(x, y){
    for (let i = objects.length - 1; i >= 0; i--){
        const obj = objects[i];

        if (obj.type === 'marker'){
            const dist = Math.sqrt(Math.pow(x - obj.x1, 2) + Math.pow(y - obj.y1, 2));
            if (dist <= obj.size / 2) return obj;
        }
        else if (obj.type === 'circle'){
            const b = circleBBox(obj);
            const distToCenter = Math.sqrt(Math.pow(x - b.cx, 2) + Math.pow(y - b.cy, 2));
            if (obj.fillStyle === 'fill'){
                if (distToCenter <= b.r) return obj;
            } else {
                if (Math.abs(distToCenter - b.r) <= Math.max(15, obj.size)) return obj;
            }
        }
        else if (obj.type === 'text'){
            const m = textMetrics(obj);
            if (x >= obj.x1 && x <= obj.x1 + m.w && y >= obj.y1 && y <= obj.y1 + m.h) return obj;
        }
        else {
            const minX = Math.min(obj.x1, obj.x2) - 10;
            const minY = Math.min(obj.y1, obj.y2) - 10;
            const maxX = Math.max(obj.x1, obj.x2) + 10;
            const maxY = Math.max(obj.y1, obj.y2) + 10;
            if (x >= minX && x <= maxX && y >= minY && y <= maxY) return obj;
        }
    }
    return null;
}

/* =========================================================
   Pointer interaction
   ========================================================= */
function getPointerPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x:(e.clientX - rect.left) * scaleX, y:(e.clientY - rect.top) * scaleY };
}

const HANDLE_CURSOR = { nw:'nwse-resize', se:'nwse-resize', ne:'nesw-resize', sw:'nesw-resize', p1:'move', p2:'move', size:'nwse-resize' };
function updateCanvasCursor(pos){
    if (isSpaceDown){ canvas.style.cursor = 'grab'; return; }
    if (currentMode === 'select'){
        if (pos){
            const h = findHandleAt(pos.x, pos.y);
            if (h){ canvas.style.cursor = HANDLE_CURSOR[h] || 'pointer'; return; }
            if (findObjectAt(pos.x, pos.y)){ canvas.style.cursor = 'move'; return; }
        }
        canvas.style.cursor = 'default';
    } else {
        canvas.style.cursor = 'crosshair';
    }
}

function onPointerDown(e){
    if (!loadedImage) return;
    if (!e.isPrimary) return;
    if (isSpaceDown || e.button === 1) return;
    if (editingObj) { commitTextEditor(false); }

    canvas.setPointerCapture(e.pointerId);

    const pos = getPointerPos(e);
    dragStartX = pos.x;
    dragStartY = pos.y;
    isDrawing = true;
    didModify = false;

    if (currentMode === 'select'){
        const h = findHandleAt(pos.x, pos.y);
        if (h){
            activeHandle = h;
            isDraggingObject = false;
            return;
        }
        const target = findObjectAt(pos.x, pos.y);
        if (target){
            isDraggingObject = true;
            dragOffsetX = pos.x - target.x1;
            dragOffsetY = pos.y - target.y1;
            setSelection(target);
        } else {
            isDraggingObject = false;
            setSelection(null);
        }
        drawAll();
    }
    else if (currentMode === 'marker'){
        const typed = parseInt(startNumInput.value, 10);
        const num = isNaN(typed) ? nextNumber : typed;
        objects.push({
            type:'marker', x1:pos.x, y1:pos.y, x2:pos.x, y2:pos.y,
            color:primaryColorInput.value,
            size:parseInt(brushSizeInput.value, 10) || 30,
            opacity:(parseInt(brushOpacityInput.value, 10) || 100) / 100,
            text:num, textColor:textColorInput.value
        });
        nextNumber = num + 1;
        updateNextNumberInput();
        isDrawing = false;
        saveHistory();
        refreshUI();
        drawAll();
    }
    else if (currentMode === 'text'){
        // item 10: type straight on the canvas
        const obj = {
            type:'text', x1:pos.x, y1:pos.y, x2:pos.x, y2:pos.y,
            color:primaryColorInput.value,
            size:parseInt(brushSizeInput.value, 10) || 20,
            opacity:(parseInt(brushOpacityInput.value, 10) || 100) / 100,
            text:''
        };
        objects.push(obj);
        isDrawing = false;
        openTextEditor(obj, true);
    }
    else {
        objects.push({
            type:currentMode, x1:pos.x, y1:pos.y, x2:pos.x, y2:pos.y,
            color:primaryColorInput.value,
            size:parseInt(brushSizeInput.value, 10) || 5,
            opacity:(parseInt(brushOpacityInput.value, 10) || 100) / 100,
            fillStyle:fillStyleSelect.value
        });
        drawAll();
    }
}

function onPointerMove(e){
    if (!e.isPrimary) return;

    if (!isDrawing){
        if (loadedImage) updateCanvasCursor(getPointerPos(e));
        return;
    }

    const pos = getPointerPos(e);

    if (currentMode === 'select' && activeHandle && selectedObject){
        resizeObject(selectedObject, activeHandle, pos);
        didModify = true;
        drawAll();
    }
    else if (currentMode === 'select' && isDraggingObject && selectedObject){
        const dx = pos.x - dragStartX;
        const dy = pos.y - dragStartY;
        selectedObject.x1 = pos.x - dragOffsetX;
        selectedObject.y1 = pos.y - dragOffsetY;
        selectedObject.x2 += dx;
        selectedObject.y2 += dy;
        dragStartX = pos.x;
        dragStartY = pos.y;
        didModify = true;
        drawAll();
    }
    else if (currentMode !== 'select' && currentMode !== 'marker' && currentMode !== 'text'){
        const currentObj = objects[objects.length - 1];
        if (!currentObj) return;
        currentObj.x2 = pos.x;
        currentObj.y2 = pos.y;
        didModify = true;
        drawAll();
    }
}

function onPointerUp(e){
    if (!isDrawing) return;
    isDrawing = false;
    activeHandle = null;
    isDraggingObject = false;

    // drop degenerate shapes created by an accidental click
    if (!didModify && currentMode !== 'select' && currentMode !== 'marker' && currentMode !== 'text'){
        objects.pop();
        drawAll();
        renderLayers();
        return;
    }

    if (didModify){
        saveHistory();
        refreshUI();
    }
    drawAll();
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerUp);

canvas.addEventListener('dblclick', function(e){
    if (!loadedImage || currentMode !== 'select') return;
    const pos = getPointerPos(e);
    const target = findObjectAt(pos.x, pos.y);
    if (target && target.type === 'text') openTextEditor(target, false);
});

/* =========================================================
   Inline text editor (item 10)
   ========================================================= */
function positionTextEditor(obj){
    textEditor.style.left = obj.x1 + 'px';
    textEditor.style.top = obj.y1 + 'px';
    textEditor.style.fontSize = obj.size + 'px';
    textEditor.style.fontFamily = CANVAS_FONT;
    textEditor.style.fontWeight = 'bold';
    textEditor.style.color = obj.color;
    const m = textMetrics({ text: textEditor.value || 'M', size: obj.size });
    textEditor.style.width = Math.max(obj.size * 3, m.w + obj.size) + 'px';
    textEditor.style.height = (obj.size * 1.25) + 'px';
}

function openTextEditor(obj, isNew){
    editingObj = obj;
    editingIsNew = isNew;
    setSelection(obj);
    textEditor.value = isNew ? '' : String(obj.text || '');
    positionTextEditor(obj);
    textEditor.style.display = 'block';
    drawAll();
    setTimeout(function(){ textEditor.focus(); textEditor.select(); }, 0);
}

textEditor.addEventListener('input', function(){ if (editingObj) positionTextEditor(editingObj); });
textEditor.addEventListener('keydown', function(e){
    e.stopPropagation();
    if (e.key === 'Enter'){ e.preventDefault(); commitTextEditor(false); }
    if (e.key === 'Escape'){ e.preventDefault(); commitTextEditor(true); }
});
textEditor.addEventListener('blur', function(){ commitTextEditor(false); });

function commitTextEditor(cancel){
    if (!editingObj) return;
    const obj = editingObj;
    const wasNew = editingIsNew;
    const val = textEditor.value.trim();
    editingObj = null;
    editingIsNew = false;
    textEditor.style.display = 'none';

    let changed = false;
    if (cancel || !val){
        // a brand new object was never committed to history, so dropping it
        // simply restores the last saved state — no new history entry needed
        if (wasNew){
            const i = objects.indexOf(obj);
            if (i !== -1) objects.splice(i, 1);
            if (selectedObject === obj) selectedObject = null;
        }
    } else if (obj.text !== val || wasNew){
        obj.text = val;
        changed = true;
    }

    if (changed) saveHistory();
    refreshUI();
    drawAll();
}

/* =========================================================
   Shape drawing helpers
   ========================================================= */
function drawArrowHead(x1, y1, x2, y2, thickness){
    const dx = x2 - x1, dy = y2 - y1;
    const distance = Math.sqrt(dx * dx + dy * dy);
    if (distance < 5) return;

    const headLength = thickness * 2.5 + 12;
    const angle = Math.atan2(dy, dx);
    const shrinkLength = Math.min(distance * 0.5, headLength * 0.7);
    const lineEndX = x2 - shrinkLength * Math.cos(angle);
    const lineEndY = y2 - shrinkLength * Math.sin(angle);

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(lineEndX, lineEndY);
    ctx.stroke();

    ctx.save();
    ctx.lineJoin = 'miter';
    ctx.miterLimit = 4;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLength * Math.cos(angle - Math.PI / 6), y2 - headLength * Math.sin(angle - Math.PI / 6));
    ctx.lineTo(x2 - headLength * Math.cos(angle + Math.PI / 6), y2 - headLength * Math.sin(angle + Math.PI / 6));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function drawMosaicPixel(sx, sy, w, h, size, opacity){
    if (w === 0 || h === 0) return;
    const x = w < 0 ? sx + w : sx;
    const y = h < 0 ? sy + h : sy;
    const absW = Math.abs(w), absH = Math.abs(h);

    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    const grainSize = Math.max(5, size / 2);

    tempCanvas.width = Math.max(1, absW / grainSize);
    tempCanvas.height = Math.max(1, absH / grainSize);
    tempCtx.drawImage(canvas, x, y, absW, absH, 0, 0, tempCanvas.width, tempCanvas.height);

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = opacity;
    ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, x, y, absW, absH);
    ctx.restore();
}

/* =========================================================
   Export (item 9)
   ========================================================= */
exportFormat.addEventListener('change', function(){
    qualityField.style.display = this.value === 'image/jpeg' ? '' : 'none';
});
jpgQuality.addEventListener('input', function(){ qualityVal.textContent = this.value + '%'; });


function buildDataUrl(){
    const format = exportFormat.value;
    if (format === 'image/jpeg'){
        const t = document.createElement('canvas');
        t.width = canvas.width;
        t.height = canvas.height;
        const tc = t.getContext('2d');
        tc.fillStyle = '#ffffff';          // transparent areas would turn black in JPG
        tc.fillRect(0, 0, t.width, t.height);
        tc.drawImage(canvas, 0, 0);
        return t.toDataURL('image/jpeg', (parseInt(jpgQuality.value, 10) || 90) / 100);
    }
    return canvas.toDataURL('image/png');
}

function saveCurrent(name){
    const fileExt = exportFormat.value === 'image/jpeg' ? 'jpg' : 'png';
    let customName = (name || '').trim();
    if (!customName) customName = 'picmark_export_' + Date.now();

    const tempSelected = selectedObject;
    selectedObject = null;
    drawAll();

    const link = document.createElement('a');
    link.download = customName + '.' + fileExt;
    link.href = buildDataUrl();
    link.click();

    selectedObject = tempSelected;
    drawAll();
}

downloadBtn.addEventListener('click', function(){
    if (!loadedImage){ alert(dict().noImageAlert); return; }
    commitTextEditor(false);
    saveCurrent(fileNameInput.value);
});

downloadAllBtn.addEventListener('click', function(){
    if (docs.length < 2) return;
    commitTextEditor(false);
    syncActiveDoc();
    const startedAt = activeIndex;
    downloadAllBtn.disabled = true;
    let i = 0;
    (function step(){
        if (i >= docs.length){
            activateDoc(startedAt);
            downloadAllBtn.disabled = false;
            return;
        }
        const idx = i++;
        activateDoc(idx);
        saveCurrent(docs[idx].fileName);
        setTimeout(step, 400);   // browsers throttle rapid consecutive downloads
    })();
});

/* =========================================================
   Boot
   ========================================================= */
updateLanguage(currentLang);
resetToEmpty();
updateCanvasCursor();
applyTransform();
</script>
